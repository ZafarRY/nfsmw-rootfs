name: Lift test
on: workflow_dispatch

jobs:
  lift:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gabung seed
        working-directory: tool
        run: |
          python - <<'EOF'
          import json
          a = json.load(open('work/vtable_seeds.json'))
          b = json.load(open('work/rtti_seeds.json'))
          seen, out = set(), []
          for s in a + b:
              if s['address'] not in seen:
                  seen.add(s['address'])
                  out.append(s)
          json.dump(out, open('work/seeds_all.json', 'w'), indent=1)
          print(len(out), 'seed')
          EOF

      - name: Catalog
        working-directory: tool
        shell: bash
        run: python scripts/run_lift.py catalog work/SPEED.analysis.exe work/seeds_all.json work/catalog.json 2>&1 | tee work/catalog.log

      - name: Lift
        working-directory: tool
        shell: bash
        run: |
          python scripts/run_lift.py lift work/SPEED.analysis.exe work/catalog.json src/recomp/gen 2>&1 | tee work/lift.log
          echo "File C: $(find src/recomp/gen -name '*.c' | wc -l)" | tee work/ringkasan.txt
          echo "Baris C: $(find src/recomp/gen -name '*.c' -exec cat {} + | wc -l)" | tee -a work/ringkasan.txt
          du -sh src/recomp/gen | tee -a work/ringkasan.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lift-log
          path: |
            tool/work/*.log
            tool/work/ringkasan.txt
            tool/work/seeds_all.json
